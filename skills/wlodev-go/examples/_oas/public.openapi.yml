openapi: 3.0.3
info:
    title: Example API
    version: 0.0.0
servers:
    - url: 'http://localhost:5050'
      description: Local server
# Paths only. Each path item lives in its domain folder.
paths:
    /v1/health:
        $ref: './domains/general/health.yml'
    /v1/widgets:
        $ref: './domains/widgets/widgets.yml'
    /v1/widgets/{widgetId}:
        $ref: './domains/widgets/widget.yml'
components:
    securitySchemes:
        sessionAuth:
            $ref: models.openapi.yml#/components/securitySchemes/sessionAuth
