limit:
    name: limit
    in: query
    description: The maximum number of items to return.
    required: false
    schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    example: 20

until:
    name: until
    in: query
    description: Get items before this timestamp (ISO 8601 format).
    required: false
    schema:
        type: string
        format: date-time
    example: 2024-01-01T00:00:00Z

since:
    name: since
    in: query
    description: Get items after this timestamp (ISO 8601 format).
    required: false
    schema:
        type: string
        format: date-time
    example: 2023-01-01T00:00:00Z
