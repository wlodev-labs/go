get:
    operationId: generalHealthGet
    summary: Health check endpoint
    description: This endpoint is used to check the health of the application.
    tags:
        - General
    security: []
    responses:
        '200':
            description: API is healthy
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - status
                        properties:
                            status:
                                type: string
                                example: 'ok'
